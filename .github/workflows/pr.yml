yamlname: Gradle PR Check

on:
  pull_request:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the pull request code branch
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the specific Java version required for your project
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Configure Gradle caching and environments natively
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Make the gradlew wrapper executable (prevents potential permission errors)
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # 5. Run your desired Gradle command (e.g., ./gradlew test or ./gradlew build)
    - name: Run Gradle Command
      run: ./gradlew build
