name: Test Trello Card with Checklist
on:
  workflow_dispatch:

jobs:
  test-trello:
    runs-on: ubuntu-latest
    steps:
      - name: Create Card A with Checklist and Subtask B, then create Card B and link them
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID_TO_DO }}
        run: |
          echo "Creating Card A..."
          CARD_A_RESPONSE=$(curl -s -X POST \
            "https://trello.com/1/cards" \
            -d "key=${TRELLO_KEY}" \
            -d "token=${TRELLO_TOKEN}" \
            -d "idList=${TRELLO_LIST_ID}" \
            -d "name=A" \
            -d "desc=Card A with subtasks")
          
          CARD_A_ID=$(echo "$CARD_A_RESPONSE" | jq -r '.id')
          CARD_A_URL=$(echo "$CARD_A_RESPONSE" | jq -r '.url')
          echo "✓ Card A created with ID: $CARD_A_ID"
          echo "  URL: $CARD_A_URL"
          
          echo "Creating Checklist on Card A..."
          CHECKLIST_RESPONSE=$(curl -s -X POST \
            "https://trello.com/1/cards/${CARD_A_ID}/checklists" \
            -d "key=${TRELLO_KEY}" \
            -d "token=${TRELLO_TOKEN}" \
            -d "name=Subtasks")
          
          CHECKLIST_ID=$(echo "$CHECKLIST_RESPONSE" | jq -r '.id')
          echo "✓ Checklist created with ID: $CHECKLIST_ID"
          
          echo "Creating Card B..."
          CARD_B_RESPONSE=$(curl -s -X POST \
            "https://trello.com/1/cards" \
            -d "key=${TRELLO_KEY}" \
            -d "token=${TRELLO_TOKEN}" \
            -d "idList=${TRELLO_LIST_ID}" \
            -d "name=B" \
            -d "desc=Child of Card A - [Parent: Card A](${CARD_A_URL})")
          
          CARD_B_ID=$(echo "$CARD_B_RESPONSE" | jq -r '.id')
          CARD_B_URL=$(echo "$CARD_B_RESPONSE" | jq -r '.url')
          echo "✓ Card B created with ID: $CARD_B_ID"
          echo "  URL: $CARD_B_URL"
          
          echo "Adding Subtask B to Checklist with link to Card B..."
          CHECKLIST_TEXT="B - [Link to Card](${CARD_B_URL})"
          ITEM_RESPONSE=$(curl -s -X POST \
            "https://trello.com/1/checklists/${CHECKLIST_ID}/checkItems" \
            -d "key=${TRELLO_KEY}" \
            -d "token=${TRELLO_TOKEN}" \
            -d "name=${CHECKLIST_TEXT}")
          
          ITEM_ID=$(echo "$ITEM_RESPONSE" | jq -r '.id')
          echo "✓ Subtask B added to checklist with ID: $ITEM_ID"
          echo "  Subtask text: $CHECKLIST_TEXT"
          
          echo ""
          echo "✓ Complete:"
          echo "  - Card A ($CARD_A_URL) has Checklist with Subtask B linked to Card B"
          echo "  - Card B ($CARD_B_URL) has a back-link to Card A in its description"
