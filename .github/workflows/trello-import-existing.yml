name: Bulk Import Existing Issues to Trello
on:
  workflow_dispatch:

jobs:
  import-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch and Export Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRELLO_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID_TO_DO }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
        run: |
          echo "Fetching all open issues..."
          issues_json=$(gh issue list --state open --limit 1000 --json number,title,body,url,author)
          
          CARD_MAPPING="/tmp/card_mapping.txt"
          > "$CARD_MAPPING"
          
          # Identify all sub-issues
          echo "Identifying sub-issues..."
          SUB_ISSUES=$(echo "$issues_json" | jq -r '.[] | .body // empty' | grep -oE '#[0-9]+' | sed 's/#//' | sort -u)
          
          # Pass 1: Create root issue cards
          echo ""
          echo "=== PASS 1: Creating root issue cards ==="
          while IFS= read -r line; do
            number=$(echo "$line" | jq -r '.number')
            title=$(echo "$line" | jq -r '.title')
            url=$(echo "$line" | jq -r '.url')
            author=$(echo "$line" | jq -r '.author.login')
            
            if echo "$SUB_ISSUES" | grep -q "^${number}$"; then
              echo "⊘ #${number} is a sub-issue, skipping"
              continue
            fi
            
            echo "Creating card for #${number}: $title"
            
            desc="Issue: #${number}%0AAuthor: @${author}%0A${url}"
            encoded_title=$(jq -nr --arg x "$title" '$x|@uri')
            encoded_desc=$(jq -nr --arg x "$desc" '$x|@uri')
            
            card=$(curl -s -X POST "https://trello.com/1/cards?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}&idList=${TRELLO_LIST_ID}&name=${encoded_title}&desc=${encoded_desc}")
            card_id=$(echo "$card" | jq -r '.id')
            card_url=$(echo "$card" | jq -r '.url')
            
            if [ ! -z "$card_id" ] && [ "$card_id" != "null" ]; then
              echo "✓ Created card $card_id"
              echo "$number:$card_id:$card_url" >> "$CARD_MAPPING"
            else
              echo "✗ Failed to create card"
            fi
            
            sleep 0.3
          done < <(echo "$issues_json" | jq -c '.[]')
          
          # Pass 2: Create checklists and sub-issue cards
          echo ""
          echo "=== PASS 2: Creating checklists and sub-issue cards ==="
          while IFS= read -r line; do
            number=$(echo "$line" | jq -r '.number')
            title=$(echo "$line" | jq -r '.title')
            body=$(echo "$line" | jq -r '.body // empty')
            
            if echo "$SUB_ISSUES" | grep -q "^${number}$"; then
              continue
            fi
            
            # Find sub-issues mentioned in this issue
            mentioned=$(echo "$body" | grep -oE '#[0-9]+' | sed 's/#//' | sort -u)
            
            if [ -z "$mentioned" ]; then
              continue
            fi
            
            echo "Issue #${number} has sub-issues: $mentioned"
            
            # Get parent card info
            parent_line=$(grep "^${number}:" "$CARD_MAPPING")
            parent_id=$(echo "$parent_line" | cut -d: -f2)
            parent_url=$(echo "$parent_line" | cut -d: -f3)
            
            if [ -z "$parent_id" ]; then
              echo "⊘ Parent card not found"
              continue
            fi
            
            # Create checklist
            echo "Creating checklist on $parent_id"
            checklist=$(curl -s -X POST "https://trello.com/1/cards/${parent_id}/checklists?name=Subtasks&key=${TRELLO_KEY}&token=${TRELLO_TOKEN}")
            checklist_id=$(echo "$checklist" | jq -r '.id')
            
            if [ -z "$checklist_id" ] || [ "$checklist_id" = "null" ]; then
              echo "✗ Failed to create checklist"
              continue
            fi
            
            echo "✓ Checklist created: $checklist_id"
            
            # Process each sub-issue
            while IFS= read -r sub_num; do
              [ -z "$sub_num" ] && continue
              
              echo "  Processing sub-issue #$sub_num"
              
              # Get sub-issue from GitHub
              sub=$(curl -s -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/${{ github.repository }}/issues/${sub_num}")
              sub_title=$(echo "$sub" | jq -r '.title')
              sub_url=$(echo "$sub" | jq -r '.html_url')
              sub_author=$(echo "$sub" | jq -r '.user.login')
              
              # Create sub-issue card
              echo "    Creating card for #$sub_num"
              sub_desc="Issue: #${sub_num}%0AAuthor: @${sub_author}%0A${sub_url}%0AParent: #${number}"
              encoded_sub_title=$(jq -nr --arg x "$sub_title" '$x|@uri')
              encoded_sub_desc=$(jq -nr --arg x "$sub_desc" '$x|@uri')
              
              sub_card=$(curl -s -X POST "https://trello.com/1/cards?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}&idList=${TRELLO_LIST_ID}&name=${encoded_sub_title}&desc=${encoded_sub_desc}")
              sub_card_id=$(echo "$sub_card" | jq -r '.id')
              sub_card_url=$(echo "$sub_card" | jq -r '.url')
              
              if [ ! -z "$sub_card_id" ] && [ "$sub_card_id" != "null" ]; then
                echo "    ✓ Sub-card created: $sub_card_id"
                
                # Add checklist item with link
                echo "    Adding to checklist"
                item_name="#${sub_num}: ${sub_title} -> ${sub_card_url}"
                encoded_item=$(echo -n "$item_name" | jq -sRr @uri)
                
                item=$(curl -s -X POST "https://trello.com/1/checklists/${checklist_id}/checkItems?name=${encoded_item}&key=${TRELLO_KEY}&token=${TRELLO_TOKEN}")
                item_id=$(echo "$item" | jq -r '.id')
                
                if [ ! -z "$item_id" ] && [ "$item_id" != "null" ]; then
                  echo "    ✓ Added to checklist"
                else
                  echo "    ✗ Failed to add to checklist"
                fi
              else
                echo "    ✗ Failed to create sub-card"
              fi
              
              sleep 0.2
            done < <(echo "$mentioned")
            
            sleep 0.3
          done < <(echo "$issues_json" | jq -c '.[]')
          
          echo ""
          echo "Done!"
