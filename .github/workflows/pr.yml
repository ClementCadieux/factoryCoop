name: PR Verification

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Build and Test
        run: ./gradlew build test
